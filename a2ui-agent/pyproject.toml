[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2ui-agent"
version = "0.2.0"
description = "A2UI (Agent-to-UI) protocol toolset for Google ADK — schema catalogs and the SendA2uiToClient toolset for LLM-guided UI generation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "adk-fluent contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["a2ui", "adk", "google", "agents", "ui", "llm"]

dependencies = [
    "google-adk>=1.20.0",
]

[project.optional-dependencies]
flux = []

[project.urls]
Homepage = "https://github.com/vamsiramakrishnan/adk-fluent"
Repository = "https://github.com/vamsiramakrishnan/adk-fluent"
Issues = "https://github.com/vamsiramakrishnan/adk-fluent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/a2ui"]
# Bundled JSON catalogs under src/a2ui/data are included as package data by the
# packages entry above — no force-include (it produced duplicate wheel entries).

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv/",
    "dist/",
    "__pycache__/",
    "*.egg-info/",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B905", "SIM108"]
